[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textchef"
version = "0.1.0"
license = "MIT"
authors = [{ name = "Alexander Wilson" }]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-learn>=1.3",
    "umap-learn",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
model = ["sentence-transformers", "torch"]
test = ["pytest", "httpx"]

[project.scripts]
textchef = "textchef.cli:main"

[tool.setuptools.packages.find]
include = ["textchef*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
